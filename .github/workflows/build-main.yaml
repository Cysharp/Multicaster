name: Build-Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-debug:
    name: Build and run tests
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: Cysharp/Actions/.github/actions/checkout@main
      - uses: Cysharp/Actions/.github/actions/setup-dotnet@main
      - run: dotnet tool restore
      - run: dotnet build -c Release -p:DefineConstants=RUNNING_IN_CI
      - run: dotnet pack -c Release --no-build -p:SymbolPackageFormat=snupkg -o ./publish
      - run: dotnet test -c Release --no-build
      - name: Verify packages (CodeGen)
        run: |
          pwsh ./test/verify-packages.ps1 -PackageDirectory ./publish -Version 0.1.0
          dotnet restore ./test/Multicaster.CodeGen.PackageFixture/Multicaster.CodeGen.PackageFixture.csproj --source ./publish
          dotnet build ./test/Multicaster.CodeGen.PackageFixture/Multicaster.CodeGen.PackageFixture.csproj -c Release --no-restore
          dotnet restore ./test/Multicaster.SourceGenerator.PackageFixture/Multicaster.SourceGenerator.PackageFixture.csproj --source ./publish
          dotnet run --project ./test/Multicaster.SourceGenerator.PackageFixture/Multicaster.SourceGenerator.PackageFixture.csproj -c Release --no-restore
      - name: Run NativeAOT tests
        run: |
          dotnet publish ./test/Multicaster.NativeAotTest/Multicaster.NativeAotTest.csproj -c Release -r linux-x64 -o ./artifacts/nativeaot -p:IlcTreatWarningsAsErrors=true
          ./artifacts/nativeaot/Multicaster.NativeAotTest
      - uses: Cysharp/Actions/.github/actions/upload-artifact@main
        with:
          name: nuget
          path: ./publish/*.*nupkg
          retention-days: 1
